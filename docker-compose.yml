# 用 Docker 部署：docker compose up -d --build
# 打开 http://localhost:3200 。第一次启动生成的庄家（管理员）密码：
#   docker compose exec arena cat /app/data/admin-initial-password.txt
# 数据（数据库、加密主密钥）保存在 ./data，升级、重建容器都不会丢；引擎（可选）放进 ./engines，见 engines/README.md。
# 配置写在 .env（可选，见 .env.example）；换端口：ARENA_PORT=8080 docker compose up -d
services:
  arena:
    build: .
    image: ai-cricket-arena:latest
    container_name: ai-cricket-arena
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3200
    ports:
      - "${ARENA_PORT:-3200}:3200"
    volumes:
      - ./data:/app/data
      - ./engines:/app/engines
