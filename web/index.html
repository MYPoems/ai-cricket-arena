<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a0b08">
  <title>电子斗蛐蛐</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%228%22 fill=%22%23b4241a%22/><rect x=%225%22 y=%225%22 width=%2254%22 height=%2254%22 rx=%225%22 fill=%22none%22 stroke=%22%23fbefd2%22 stroke-width=%222.5%22/><text x=%2232%22 y=%2246%22 font-size=%2238%22 text-anchor=%22middle%22 fill=%22%23fbefd2%22 font-weight=%22900%22 font-family=%22serif%22>斗</text></svg>">
  <script>
    // 默认深色朱漆，可切换为浅色宣纸，选择记在本机浏览器里
    try { document.documentElement.dataset.theme = localStorage.getItem('theme2') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/ladder.css">
</head>
<body>
  <a class="skip-link" href="#app" id="skipLink">跳到正文</a>
  <div class="route-bar" id="routeBar" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="#/"><span class="seal">斗</span><span class="brand-name">电子斗蛐蛐</span></a>
    <!-- 手机上的对局页：不放整排导航，只留一个「‹ 大厅 · 游戏名」返回 -->
    <a class="top-back" id="topBack" href="#/" aria-label="返回大厅"><span class="chev" aria-hidden="true">‹</span>大厅<span class="top-back-g" id="topBackGame"></span></a>
    <nav class="nav" id="nav" aria-label="主导航">
      <a href="#/" data-r="lobby">大厅</a>
      <a href="#/rooms" data-r="rooms">组局</a>
      <a href="#/new" data-r="play">开局</a>
      <a href="#/characters" data-r="characters">蛐蛐</a>
      <a href="#/ladder" data-r="ladder">天梯</a>
      <a href="#/history" data-r="history">对局记录</a>
      <a href="#/settings" data-r="settings">设置</a>
      <a href="#/admin" data-r="admin" id="navAdmin" hidden>审批<span class="badge" id="pendingBadge" hidden></span></a>
    </nav>
    <div class="top-right">
      <div class="live-dot" id="liveDot" role="status"></div>
      <span id="userBox"></span>
      <button class="icon-btn theme-btn" id="themeBtn" type="button" title="切换深浅色" aria-label="切换深浅色"></button>
    </div>
  </header>
  <main id="app" tabindex="-1" aria-busy="true">
    <!-- 首屏骨架：脚本加载完、第一页画出来之前先占好位置，不白屏 -->
    <div class="skel" aria-hidden="true">
      <div class="skel-head"><i class="sk sk-title"></i><i class="sk sk-line"></i></div>
      <div class="skel-body">
        <div class="skel-main"><i class="sk sk-hero"></i><div class="skel-grid"><i class="sk sk-card"></i><i class="sk sk-card"></i><i class="sk sk-card"></i></div></div>
        <div class="skel-side"><i class="sk sk-block"></i><i class="sk sk-block"></i></div>
      </div>
    </div>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="主导航（手机）">
    <a href="#/" data-r="lobby"><span>大厅</span></a>
    <a href="#/new" data-r="play"><span>开局</span></a>
    <a href="#/rooms" data-r="rooms"><span>组局</span></a>
    <a href="#/characters" data-r="characters"><span>蛐蛐</span></a>
    <a href="#/ladder" data-r="ladder"><span>天梯</span></a>
    <button type="button" id="moreBtn" data-r="more" aria-haspopup="dialog"><span>更多</span><span class="badge" id="moreBadge" hidden></span></button>
  </nav>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
